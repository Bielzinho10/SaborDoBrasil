<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Publicar Prato - Sabor do Brasil</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Bootstrap para melhor visual -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <img src="img/logo_sabor_do_brasil.png" alt="Logo Sabor do Brasil" class="logo">
        <h1 class="nome-site">Publicar Prato</h1>
        <div class="menu-opcoes">
            <a href="index.html" class="btn-menu">Início</a>
            <a href="caradpio.html" class="btn-menu">Cardápio</a>
        </div>
    </header>
    <main class="container" style="max-width: 600px; margin: 40px auto;">
        <div class="card">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Cadastrar Novo Prato</h2>
                <form id="form-publicar-prato">
                    <div class="mb-3">
                        <label for="nome-prato" class="form-label">Nome do Prato</label>
                        <input type="text" class="form-control" id="nome-prato" name="nome-prato" required>
                    </div>
                    <div class="mb-3">
                        <label for="descricao-prato" class="form-label">Descrição</label>
                        <textarea class="form-control" id="descricao-prato" name="descricao-prato" rows="3" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="preco-prato" class="form-label">Preço</label>
                        <input type="number" class="form-control" id="preco-prato" name="preco-prato" min="0" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label for="categoria-prato" class="form-label">Categoria</label>
                        <select class="form-control" id="categoria-prato" name="categoria-prato" required>
                            <option value="">Selecione</option>
                            <option value="Prato Principal">Prato Principal</option>
                            <option value="Sobremesa">Sobremesa</option>
                            <option value="Bebida">Bebida</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="imagem-prato" class="form-label">Imagem do Prato</label>
                        <input type="file" class="form-control" id="imagem-prato" name="imagem-prato" accept="image/*" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Publicar Prato</button>
                </form>
                <div id="preview-prato" style="display:none; margin-top:20px;">
                    <h4>Pré-visualização:</h4>
                    <img id="preview-img" src="#" alt="Prévia" style="max-width:100%; border-radius:8px; margin-bottom:10px;">
                    <p><strong>Nome:</strong> <span id="preview-nome"></span></p>
                    <p><strong>Descrição:</strong> <span id="preview-desc"></span></p>
                    <p><strong>Preço:</strong> R$ <span id="preview-preco"></span></p>
                    <p><strong>Categoria:</strong> <span id="preview-categoria"></span></p>
                </div>
            </div>
        </div>
    </main>
    <footer class="rodape">
        <span>Sabor do Brasil &copy; 2025</span>
        <div class="redes-sociais">
            <a href="https://wa.me/5598987654321" target="_blank" title="WhatsApp">
                <i class="fab fa-whatsapp icone-social"></i>
            </a>
            <a href="https://instagram.com/sabordobrasiloficial" target="_blank" title="Instagram">
                <i class="fab fa-instagram icone-social"></i>
            </a>
            <a href="https://facebook.com/seu_facebook" target="_blank" title="Facebook">
                <i class="fab fa-facebook icone-social"></i>
            </a>
        </div>
    </footer>
    <script>
        // Pré-visualização do prato
        document.getElementById('imagem-prato').addEventListener('change', function(event) {
            const [file] = event.target.files;
            if (file) {
                document.getElementById('preview-img').src = URL.createObjectURL(file);
                document.getElementById('preview-prato').style.display = 'block';
            }
        });

        document.getElementById('form-publicar-prato').addEventListener('input', function() {
            document.getElementById('preview-nome').textContent = document.getElementById('nome-prato').value;
            document.getElementById('preview-desc').textContent = document.getElementById('descricao-prato').value;
            document.getElementById('preview-preco').textContent = document.getElementById('preco-prato').value;
            document.getElementById('preview-categoria').textContent = document.getElementById('categoria-prato').value;
        });

        // Exemplo de envio (apenas exibe alerta, não salva de verdade)
        document.getElementById('form-publicar-prato').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Prato publicado! (Funcionalidade de salvar não implementada neste exemplo)');
        });
    </script>
</body>
</html>
