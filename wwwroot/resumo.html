<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resumo da Compra</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }
    h1 {
      text-align: center;
      color: #D97014;
      font-size: 2rem;
    }
    .resumo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .item-carrinho {
      display: flex;
      justify-content: space-between;
      width: 80%;
      padding: 10px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    .item-carrinho h3 {
      font-size: 1.2rem;
    }
    .botao-finalizar {
      background-color: #D97014;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1.2rem;
      margin-top: 20px;
    }
    .botao-finalizar:hover {
      background-color: #bb5e11;
    }
  </style>
</head>
<body>
  <h1>Resumo da Compra</h1>
  <div class="resumo-container" id="resumo-container"></div>
  <button class="botao-finalizar" onclick="finalizarCompra()">Finalizar Compra</button>

  <script>
    let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
    const resumoContainer = document.getElementById('resumo-container');

    // Exibe os itens do carrinho
    carrinho.forEach(item => {
      const div = document.createElement('div');
      div.className = 'item-carrinho';
      div.innerHTML = `
        <h3>${item.nome}</h3>
        <span>${item.preco}</span>
      `;
      resumoContainer.appendChild(div);
    });

    // Função para finalizar a compra
    function finalizarCompra() {
      if (carrinho.length === 0) {
        alert("Seu carrinho está vazio!");
        return;
      }
      localStorage.removeItem('carrinho');
      alert("Compra finalizada com sucesso!");
      window.location.href = 'index.html';  // Redireciona para a página inicial
    }
  </script>
</body>
</html>
